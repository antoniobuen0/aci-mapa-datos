name: Vigilar nuevo curso EDUCAbase

on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: probe
        run: python3 scripts/check_new_course.py
      - name: Abrir issue si hay curso nuevo
        if: steps.probe.outputs.new_course != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COURSE: ${{ steps.probe.outputs.new_course }}
          MATR: ${{ steps.probe.outputs.matricula_ready }}
          REPORT: ${{ steps.probe.outputs.report }}
        run: |
          title="Nuevo curso en EDUCAbase: $COURSE"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number --jq '.[0].number')" ]; then
            echo "Ya existe el issue"; exit 0
          fi
          gh issue create --title "$title" --body "El Ministerio ya publica la tabla de identificación AACC de **$COURSE**.

          Matrícula (denominador de tasas) publicada: **$MATR**.

          Pasos: regenerar desde ACI-MAPA (\`scripts/publish_dataset_repo.py\`), validar cuadres (H+M = total, suma CCAA = España) y publicar aquí.

          \`\`\`
          $REPORT
          \`\`\`"
